# =============================================================================
# BillingBee — Nginx config
# Laravel (main site) + Next.js pSEO on billingbee.co
#
# Choose ONE of the two upstream blocks below depending on where Next.js runs:
#   Option A — Next.js on the same server (PM2 / node on port 3001)
#   Option B — Next.js on Vercel
# =============================================================================

# ── Option A: Next.js on same server ─────────────────────────────────────────
upstream nextjs {
    server 127.0.0.1:3001;
    keepalive 32;
}

# ── Option B: Next.js on Vercel ───────────────────────────────────────────────
# Deploy this repo to Vercel, add a custom subdomain e.g. pseo.billingbee.co
# in Vercel project settings, then point that subdomain's DNS to Vercel.
# Nginx proxies pSEO paths upstream to that Vercel origin internally.
#
# upstream nextjs {
#     server pseo.billingbee.co:443;
#     keepalive 32;
# }

# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name billingbee.co www.billingbee.co;

    # Redirect HTTP → HTTPS (remove this block if SSL is handled elsewhere)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name billingbee.co www.billingbee.co;

    # --- SSL (update paths to your actual certs) ---
    ssl_certificate     /etc/letsencrypt/live/billingbee.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/billingbee.co/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/billingbee/public;  # Laravel public dir
    index index.php;

    # ── Shared proxy headers ──────────────────────────────────────────────
    proxy_http_version  1.1;
    proxy_set_header    Upgrade $http_upgrade;
    proxy_set_header    Connection "upgrade";
    proxy_set_header    Host $host;
    proxy_set_header    X-Real-IP $remote_addr;
    proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_read_timeout  60s;

    # ── Next.js static assets (_next/static, _next/image) ─────────────────
    # Must be proxied so browser can load JS/CSS bundles for pSEO pages.
    location ^~ /_next/ {
        proxy_pass http://nextjs;
        # Option B (Vercel): use https and set host to Vercel subdomain
        # proxy_pass https://nextjs;
        # proxy_ssl_server_name on;
        # proxy_set_header Host pseo.billingbee.co;

        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Sitemap index + shards ─────────────────────────────────────────────
    location = /sitemap.xml {
        proxy_pass http://nextjs;
    }
    location ^~ /sitemap/ {
        proxy_pass http://nextjs;
    }

    # ── robots.txt ────────────────────────────────────────────────────────
    location = /robots.txt {
        proxy_pass http://nextjs;
    }

    # ── pSEO routes with fixed prefixes ──────────────────────────────────
    location ^~ /invoice-templates/ {
        proxy_pass http://nextjs;
    }
    location ^~ /invoice-generator {
        proxy_pass http://nextjs;
    }
    location ^~ /features/ {
        proxy_pass http://nextjs;
    }
    location ^~ /alternatives/ {
        proxy_pass http://nextjs;
    }
    location ^~ /for/ {
        proxy_pass http://nextjs;
    }

    # ── Location-based routes at root level ───────────────────────────────
    # Matches:
    #   /{location}/invoicing-software
    #   /{location}/invoicing-software-for/{profession}
    # e.g. /united-states/invoicing-software
    #      /london/invoicing-software-for/freelance-designers
    location ~ ^/[a-z][a-z0-9-]+/invoicing-software {
        proxy_pass http://nextjs;
    }

    # ── Everything else → Laravel ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include        fastcgi_params;
        fastcgi_pass   unix:/var/run/php/php8.2-fpm.sock;  # update PHP version
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
